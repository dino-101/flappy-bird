<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="score">Score: <span id="scoreValue">0</span></div>
            <div class="level-display">Level: <span id="currentLevel">Easy</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="startScreen" class="overlay">
            <div class="message">
                <h1>Flappy Bird</h1>
                <p>Select Difficulty Level:</p>
                <div class="level-buttons">
                    <button class="level-btn easy-btn" data-level="easy">Easy</button>
                    <button class="level-btn medium-btn" data-level="medium">Medium</button>
                    <button class="level-btn hard-btn" data-level="hard">Hard</button>
                </div>
                <p class="controls-text">Press SPACE, ↑ or Click to Play!</p>
            </div>
        </div>
        
        <div id="gameOverScreen" class="overlay hidden">
            <div class="message">
                <h1>Game Over!</h1>
                <p>Difficulty: <span id="finalLevel">Easy</span></p>
                <p>Final Score: <span id="finalScore">0</span></p>
                <div class="button-group">
                    <button id="restartBtn" class="action-btn">Play Again</button>
                    <button id="changeLevelBtn" class="action-btn secondary">Change Level</button>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <p>Controls: SPACE / ↑ Arrow / Click to Flap</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
